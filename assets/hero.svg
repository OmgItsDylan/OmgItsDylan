<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280"><style>
text { font-family: 'Inter', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
.mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
.blink { animation: blink 1.1s step-end infinite; }
